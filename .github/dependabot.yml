# Dependabot: weekly version updates (minor+patch grouped, majors one by one) + security updates.
# Internal packages/images (Nexus 10.20.50.25:8081 / k2:8081) are not reachable from GitHub and are skipped.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@k2/*"   # internal Nexus (k2:8081) — out of reach for GitHub
