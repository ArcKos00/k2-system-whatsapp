# Dependabot: weekly version updates (minor+patch grouped, majors one by one) + security updates.
# Internal images (Nexus 10.20.50.25:8081) are not reachable from GitHub: the Dockerfile's FROM lines
# go through ${REGISTRY}, so Dependabot only sees the Go modules and the Actions.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
