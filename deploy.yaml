# =============================================================================
# WhatsApp API Gateway 2.x (Go, whatsmeow) — Kubernetes deployment
# -----------------------------------------------------------------------------
# Applied by Jenkins "whatsapp_reader Deploy": envsubst (NAMESPACE, SERVICE_NAME, REPOSITORY, HOST,
# BASE_PATH, IMAGE_TAG) + kubectl apply.
#
# What changed from 1.x:
#   * No browser and no volume. The WhatsApp session, the idempotency keys, the message cache and the
#     outbox of RabbitMQ events live in Postgres (pg-whatsapp, role/schema wa_reader). The pod can
#     start on any node; nothing has to be moved or replicated. The old whatsapp-data-lh claim is no
#     longer described here — kubectl apply (no --prune) leaves it; delete it by hand once 2.x is
#     settled and 1.x will not be rolled back to (rolling back needs that volume: 1.x's session).
#   * DATABASE_URL comes from Secret wa-reader-db, made by ~/k2-security/pg-roles/wa-reader-pg-whatsapp.sh
#     on master (with the pg-whatsapp CA in ConfigMap pg-whatsapp-ca and NetworkPolicy
#     database/allow-wa-reader-to-pg-whatsapp). It points straight at pg-whatsapp-rw, NOT pgbouncer:
#     the single-owner lock is a session advisory lock.
#   * Only the owner of that lock connects WhatsApp; readiness (/health/owner) is true only there, so
#     the Service never sends traffic to a replica that does not hold the session.
#   * Memory: ~10–30 MiB in use (was 2–4 GiB with Chromium).
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${SERVICE_NAME}-config
  namespace: ${NAMESPACE}
data:
  PORT: "3000"
  PATH_BASE: ${BASE_PATH}
  LOG_LEVEL: "info"
  # Names the session (and its owner lock). Two instances with different ids keep separate devices.
  WHATSAPP_CLIENT_ID: "default"
  # Minimum gap between outbound messages (ban risk).
  WHATSAPP_MESSAGE_DELAY_MS: "3000"
  # How the device shows on the phone under "Linked devices".
  WHATSAPP_DEVICE_NAME: "K2 WhatsApp Gateway"
  # Messages (for replies, edits, deletions, retries) and published events are kept this long.
  WHATSAPP_HISTORY_RETENTION_SEC: "604800"
  # Soft heap ceiling for the Go runtime, under resources.limits.memory.
  GOMEMLIMIT: "200MiB"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    # Recreate: the old pod releases the session (and the owner lock) before the new one connects.
    # Even if two ever overlap (a node cut off from the network), the lock keeps the second one on
    # standby until Postgres drops the first one's connection (~25 s, TCP keepalives on the lock).
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ${SERVICE_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${SERVICE_NAME}
        app.kubernetes.io/version: "2"
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      # Any node will do now that there is no volume; the gpu node stays eligible as in 1.x, and a dead
      # node is left after 30 s instead of 300.
      tolerations:
        - key: k2.arckos.net/gpu
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${SERVICE_NAME}
          image: "${REPOSITORY}:${IMAGE_TAG}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: ${SERVICE_NAME}-config
            # RABBITMQ_CHAT_IDS — the forward allowlist (shared with 1.x, unchanged).
            - configMapRef:
                name: whatsapp-to-rabbit-config
            # RABBITMQ_EXCHANGE.
            - configMapRef:
                name: rabbitmq-config
            # RABBITMQ_URL (own account). Optional: without it events wait in the outbox, none are lost.
            - secretRef:
                name: ${SERVICE_NAME}-rabbit-secret
                optional: true
            # DATABASE_URL. Required: the pod does not start without it (the session lives there).
            - secretRef:
                name: ${SERVICE_NAME}-db
          volumeMounts:
            - name: pg-ca
              mountPath: /etc/pg-ca
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Ready only on the session owner — logged in or not, so Swagger, /qr and /session/login are
          # reachable to log it in. /ready still says whether the session can send, for monitoring.
          readinessProbe:
            httpGet:
              path: /health/owner
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "1000m"
              memory: "256Mi"
      volumes:
        - name: pg-ca
          configMap:
            name: pg-whatsapp-ca
---
apiVersion: v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ${SERVICE_NAME}
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# External access: QR login (${BASE_PATH}/qr), Swagger (${BASE_PATH}/docs) and the API for callers
# outside the cluster. In-cluster callers use the Service above.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  annotations:
    cert-manager.io/cluster-issuer: k2-intermediate-issuer
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - ${HOST}
      secretName: ${SERVICE_NAME}-tls-secret
  rules:
    - host: "${HOST}"
      http:
        paths:
          - path: ${BASE_PATH}
            pathType: Prefix
            backend:
              service:
                name: ${SERVICE_NAME}
                port:
                  number: 3000
