# =============================================================================
# WhatsApp API Gateway — Kubernetes deployment
# -----------------------------------------------------------------------------
# Apply with:   kubectl apply -f deploy.yaml -n k2-system
# (create the namespace once: kubectl create namespace k2-system)
#
# Notes:
#   * Single replica per instance — whatsapp-web.js keeps a LocalAuth session and a
#     headless-Chrome process that cannot be shared across pods.
#   * Several instances (one Deployment each, distinct ${SERVICE_NAME}) may share the
#     whatsapp-data PVC: every instance mounts it with subPath ${SERVICE_NAME}, so each
#     sees only its own folder of the volume and their sessions never touch. While the
#     PVC is ReadWriteOnce all instances must land on the same node.
#   * The session is persisted on the PVC; losing it forces a new QR login.
#   * /health is unauthenticated so probes work without a token.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  # Per-instance: each ${SERVICE_NAME} carries its own config, so two instances may
  # differ in client id, allowlist or pinned WA Web build without touching each other.
  name: ${SERVICE_NAME}-config
  namespace: ${NAMESPACE}
data:
  PORT: "3000"
  NODE_ENV: "production"
  KEYCLOAK_AUTH_SERVER_URL: "http://keycloak.infrastructure.svc.cluster.local:8080"
  KEYCLOAK_REALM: "k2"
  PATH_BASE: ${BASE_PATH}
  WHATSAPP_CLIENT_ID: "default"
  WHATSAPP_SESSION_PATH: "/app/data/sessions"
  WHATSAPP_MESSAGE_DELAY_MS: "3000"
  PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
  # Node heap, kept well under the container memory limit so V8 GCs instead of the
  # kernel OOM-killing the pod. Set here (envFrom wins over the image's ENV) so the
  # heap can follow a limits change without rebuilding the image — keep the two in
  # step: roughly half of resources.limits.memory, leaving the rest for the
  # Chromium renderer's native memory, which lives outside this heap.
  NODE_OPTIONS: "--max-old-space-size=2048"
  # Ceiling on the Chromium RENDERER's JS heap (the Node heap is NODE_OPTIONS above). The
  # renderer is also where WhatsApp Web decodes and re-encodes an outgoing photo, and a heap
  # too small for that makes the prep give up quietly: it returns no filehash and the send dies
  # inside WhatsApp's own bundle. Check with GET /health/media-prep?pixels=2048 before raising
  # it, and keep it well under resources.limits.memory. 0 leaves the renderer uncapped.
  WHATSAPP_RENDERER_HEAP_MB: "256"
  WHATSAPP_READY_TIMEOUT_MS: "180000"
  WHATSAPP_RECONCILE_MAX_FAILURES: "3"
  WHATSAPP_RECONCILE_BACKOFF_MAX_MS: "900000"
  # Pinning the WhatsApp Web build the session loads. Leave unset and whatsapp-web.js asks for
  # its own default build; that build is long gone from wa-version, so its cache quietly falls
  # back to whatever WhatsApp serves today — and the day WhatsApp changes the internals the
  # injected helpers use, getChats and friends start throwing minified errors.
  #
  # Pin it to the build a session was last seen working on. After a deploy the gateway logs
  # "WhatsApp Web version in use" on ready; take the version from there, confirm the file
  # exists under https://github.com/wppconnect-team/wa-version/tree/main/html and set it here.
  # Unset it again to fall back to the library default if a pinned build stops loading.
  #
  # Pinned on 2026-09-17 because the build WhatsApp serves has slimmed MsgKey down to
  # {fromMe, remote, id, participant}: the from, to, selfDir and _serialized the library fills
  # in and reads back are simply gone, so every send builds a key WhatsApp cannot index and
  # dies in its own bundle on "Data passed to getter must include an id property". The media
  # is fine and even reaches WhatsApp's servers first, which is what made this look like an
  # attachment problem for a day. This build is from 2026-07-25, two weeks after
  # whatsapp-web.js 1.34.7, and still has the old key. Bump it when the library is upgraded.
  WHATSAPP_WEB_VERSION: "2.3000.1043840091-alpha"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Deliberately NOT ${SERVICE_NAME}-scoped: this is the one volume every instance
  # shares; each instance claims its own folder on it via the mount's subPath.
  name: whatsapp-data
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    # Shared by every instance (one subPath folder each): a LocalAuth session plus
    # the idempotency store runs a few hundred MB per instance, and Chromium's
    # profile cache grows on each WA Web reload.
    # NOTE: keep this in step with the PVC that is already bound in the cluster.
    # Raising it on an existing claim is rejected by the API server ("only
    # dynamically provisioned pvc can be resized") unless the StorageClass sets
    # allowVolumeExpansion — k3s's default local-path does not, and has no resizer
    # at all, so the deploy fails on this one object while everything else applies.
    # On local-path the number is nominal anyway: the volume is a plain directory
    # on the node under no quota, so the sessions may (and do) outgrow it. To make
    # it truthful, recreate the claim out of band — which drops the sessions and
    # forces a fresh QR login unless the directory is carried over by hand.
    requests:
      storage: 1Gi
  # storageClassName: "{{storage-class}}"   # uncomment / set if no default SC
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  # Keep only the current ReplicaSet (plus one prior for rollback); avoids a
  # pile-up of old 0-replica ReplicaSets from past deploys.
  revisionHistoryLimit: 1
  strategy:
    # Recreate (not RollingUpdate): the PVC is RWO and the WhatsApp session is
    # single-owner, so the old pod must stop before the new one starts.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ${SERVICE_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${SERVICE_NAME}
    spec:
      # Allow time for a clean shutdown: SIGTERM -> close server, destroy the
      # Chromium session, close RabbitMQ. A clean exit releases the Chromium
      # SingletonLock on the PVC (the next start clears stale locks anyway).
      terminationGracePeriodSeconds: 60
      securityContext:
        # node user (uid 1000) from the base image must own the mounted volume.
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      # kubelet creates a missing subPath directory as root:root, and fsGroup does not
      # reliably reach through a subPath mount — so the instance's folder is prepared
      # here, on the volume root, before the app container ever mounts it.
      initContainers:
        - name: prepare-data-dir
          image: "${REPOSITORY}:${IMAGE_TAG}"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p "/volume/${SERVICE_NAME}" && chown -R 1000:1000 "/volume/${SERVICE_NAME}"
          securityContext:
            # The one container allowed to be root: it exists to hand the folder to uid 1000.
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
          # Tiny, but set: without them the pod is BestEffort while this container runs.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            # The volume ROOT, deliberately without subPath — the folder is made from outside.
            - name: data
              mountPath: /volume
      containers:
        - name: ${SERVICE_NAME}
          # Built from this repo's Dockerfile and pushed to your registry.
          # NOTE: with a mutable tag (e.g. "latest") IfNotPresent will NOT pull a
          # freshly pushed image — use an immutable tag (git sha) per deploy.
          image: "${REPOSITORY}:${IMAGE_TAG}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            # Chromium runs with --no-sandbox, so it needs no Linux capabilities.
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: ${SERVICE_NAME}-config
            - configMapRef:
                name: whatsapp-to-rabbit-config
            - configMapRef:
                name: rabbitmq-config
          volumeMounts:
            # The PVC is shared between instances; subPath keeps each one inside its own
            # folder of the volume while the container keeps seeing plain /app/data — so
            # WHATSAPP_SESSION_PATH and the idempotency store need no per-instance values.
            - name: data
              mountPath: /app/data
              subPath: ${SERVICE_NAME}
            # Chromium's default /dev/shm in a container is 64Mi; the renderer runs out
            # of it and dies mid-session ("Target closed"). This replaces it with a 1Gi
            # tmpfs — but note whatsappService.ts currently passes
            # --disable-dev-shm-usage, which sends that traffic to /tmp instead, so the
            # mount only starts paying off once that flag is dropped.
            - name: dshm
              mountPath: /dev/shm
          # Give the WhatsApp client time to connect / wait for QR login before
          # liveness starts killing the pod.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30   # up to ~5 min for first-time login
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # /ready (unlike /health) returns 503 whenever the WhatsApp session
          # cannot send — including 'authenticated', where login succeeded but
          # WhatsApp Web never finished loading. Keeps the pod out of the
          # Service while sends would fail with WA_NOT_READY.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              # headless Chrome is memory-hungry and grows as WA Web reloads;
              # 1Gi, then 2Gi, were too tight and caused OOMKilled (137). Node heap is
              # capped at 2048Mi (NODE_OPTIONS in the ConfigMap) below this so V8 GCs
              # instead of OOMing, leaving headroom for the Chromium renderer's native
              # memory and for the memory-backed /dev/shm, which also counts here.
              cpu: "2000m"
              memory: "4Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: whatsapp-data
        - name: dshm
          emptyDir:
            # tmpfs — pages actually used count against the container memory limit
            # above, so sizeLimit is a ceiling, not a reservation.
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ${SERVICE_NAME}
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Optional: external access for QR login (/whatsapp-api/qr) and Swagger
# (/whatsapp-api/docs). The web-server reaches the gateway in-cluster via the
# Service above (http://whatsapp-api:3000) and does NOT need this Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  annotations:
    cert-manager.io/cluster-issuer: k2-intermediate-issuer
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - ${HOST}
      secretName: ${SERVICE_NAME}-tls-secret
  rules:
    - host: "${HOST}"
      http:
        paths:
          - path: ${BASE_PATH}
            pathType: Prefix
            backend:
              service:
                name: ${SERVICE_NAME}
                port:
                  number: 3000
